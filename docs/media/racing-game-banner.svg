<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Racing Game — draw the road, drive the line</title>
  <desc id="desc">A decorative neon banner with a spline circuit, control points and a pink racing car. Play, build roads and train AI drivers.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a30"/>
      <stop offset="1" stop-color="#080c18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff006e"/>
      <stop offset="1" stop-color="#b94bff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#26334b" stroke-width="1" opacity=".32"/>
    </pattern>
    <path id="circuit" d="M 828 132 C 880 78 1010 78 1075 124 C 1140 170 1210 177 1180 245 C 1155 300 1069 268 1050 325 C 1034 375 932 372 918 319 C 902 260 790 292 778 232 C 769 190 800 160 828 132 Z"/>
  </defs>
  <rect width="1280" height="440" rx="24" fill="url(#background)"/>
  <rect width="1280" height="440" rx="24" fill="url(#grid)"/>
  <path d="M 0 439 H 1280" stroke="url(#accent)" stroke-width="3"/>
  <rect x="64" y="54" width="5" height="16" rx="2" fill="#00e4c5"/>
  <text x="83" y="67" fill="#a2b1c9" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" letter-spacing="3">A 2D RACING PLAYGROUND</text>
  <text x="62" y="150" fill="#f4f7ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="49" font-weight="800" letter-spacing="-1">DRAW THE ROAD.</text>
  <text x="62" y="213" fill="#ff338b" font-family="DejaVu Sans,Arial,sans-serif" font-size="49" font-weight="800" letter-spacing="-1">DRIVE THE LINE.</text>
  <text x="65" y="264" fill="#b1bed3" font-family="DejaVu Sans,Arial,sans-serif" font-size="18">Your circuits. Your cars. Your next AI rival.</text>
  <g font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">
    <rect x="64" y="308" width="108" height="38" rx="19" fill="#ff006e" fill-opacity=".14" stroke="#ff338b"/>
    <text x="118" y="332" fill="#ff72ae" text-anchor="middle">PLAY</text>
    <rect x="184" y="308" width="108" height="38" rx="19" fill="#00e4c5" fill-opacity=".08" stroke="#1a7b83"/>
    <text x="238" y="332" fill="#7fe7e4" text-anchor="middle">BUILD</text>
    <rect x="304" y="308" width="108" height="38" rx="19" fill="#b94bff" fill-opacity=".1" stroke="#79539e"/>
    <text x="358" y="332" fill="#d6b4ff" text-anchor="middle">TRAIN</text>
  </g>
  <text x="65" y="394" fill="#71829f" font-family="DejaVu Sans,Arial,sans-serif" font-size="13">Spline circuits · Custom cars · Reinforcement learning</text>
  <path d="M 709 62 V 377" stroke="#26334b" stroke-width="1"/>
  <g fill="none" stroke-linejoin="round">
    <use href="#circuit" stroke="#00e4c5" stroke-width="59" opacity=".04"/>
    <use href="#circuit" stroke="#00e4c5" stroke-width="49" opacity=".08"/>
    <use href="#circuit" stroke="#1e6579" stroke-width="39"/>
    <use href="#circuit" stroke="#080e1b" stroke-width="34"/>
    <use href="#circuit" stroke="#99b4ce" stroke-width="1.5" stroke-dasharray="7 9" opacity=".7"/>
  </g>
  <g fill="#0c1625" stroke="#50e5d3" stroke-width="2">
    <circle cx="828" cy="132" r="5"/>
    <circle cx="1075" cy="124" r="5"/>
    <circle cx="1180" cy="245" r="5"/>
    <circle cx="1050" cy="325" r="5"/>
    <circle cx="918" cy="319" r="5"/>
    <circle cx="778" cy="232" r="5"/>
  </g>
  <g transform="translate(1104 284) rotate(158)">
    <path d="M -54 -4 H -27 M -65 4 H -27" stroke="#ff338b" stroke-width="3" stroke-linecap="round" opacity=".4"/>
    <rect x="-17" y="-13" width="11" height="5" rx="1" fill="#03050c"/>
    <rect x="-17" y="8" width="11" height="5" rx="1" fill="#03050c"/>
    <rect x="9" y="-13" width="11" height="5" rx="1" fill="#03050c"/>
    <rect x="9" y="8" width="11" height="5" rx="1" fill="#03050c"/>
    <path d="M -23 -9 L 14 -10 L 24 -6 L 24 6 L 14 10 L -23 9 Z" fill="#ff006e" stroke="#ff86bb" stroke-width="1.5"/>
    <path d="M -4 -7 L 9 -7 L 14 -4 L 14 4 L 9 7 L -4 7 Z" fill="#142a44" stroke="#5ccfe9" stroke-width="1"/>
    <path d="M 24 -6 V -2 M 24 2 V 6" stroke="#fff3b0" stroke-width="2"/>
    <path d="M -23 -8 V -4 M -23 4 V 8" stroke="#ff6868" stroke-width="2"/>
  </g>
  <text x="978" y="405" fill="#638e9f" font-family="DejaVu Sans,Arial,sans-serif" font-size="11" letter-spacing="3" text-anchor="middle">FROM POINTS TO A RACETRACK</text>
</svg>
